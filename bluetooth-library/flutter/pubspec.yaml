name: prology_bluetooth
description: >
  Flutter библиотека для интеграции с PROLOGY Bluetooth устройствами.
  Поддерживает Classic Bluetooth (SPP) и BLE подключения.
version: 1.0.0
homepage: https://github.com/your-org/prology-bluetooth-library

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # Classic Bluetooth (SPP)
  flutter_bluetooth_serial: ^0.4.0

  # BLE (Bluetooth Low Energy)
  flutter_blue_plus: ^1.31.0

  # Утилиты
  convert: ^3.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
